<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.resetTitle">重置密码 - 光影集</title>
  <link rel="stylesheet" href="/css/vendor/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 1px 1px, white 1px, transparent 0); background-size: 40px 40px;"></div>

  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
    <div class="flex items-center justify-between mb-8">
      <a href="/" class="flex items-center gap-2 text-xl font-bold">
        <span class="text-2xl">📷</span>
        <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent" data-i18n="site.logo">光影集</span>
      </a>
      <button id="langSwitch" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:border-indigo-500 hover:text-indigo-600 transition">
        <span id="langLabel">English</span>
      </button>
    </div>

    <h2 class="text-2xl font-bold text-center mb-2" data-i18n="auth.resetTitle">重置密码</h2>
    <p class="text-center text-sm text-gray-500 mb-8" data-i18n="auth.resetDesc">请设置您的新密码</p>

    <div id="invalidToken" class="hidden text-center">
      <div class="text-6xl mb-4">⚠️</div>
      <div id="invalidMsg" class="text-red-600 font-medium mb-6"></div>
      <a href="/forgot-password" class="inline-block px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-medium hover:opacity-90" data-i18n="auth.requestAgain">重新申请</a>
    </div>

    <form id="resetForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="profile.newPassword">新密码</label>
        <input type="password" id="newPassword" name="newPassword" required minlength="6"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        <p class="text-xs text-gray-400 mt-1" data-i18n="profile.minChars">至少 6 位</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="profile.confirmPassword">确认新密码</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div id="successMsg" class="hidden px-4 py-3 bg-green-50 text-green-700 rounded-lg text-sm"></div>
      <div id="errorMsg" class="hidden px-4 py-3 bg-red-50 text-red-600 rounded-lg text-sm"></div>
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-medium hover:opacity-90 transition shadow-lg" data-i18n="auth.confirmReset">确认重置</button>
    </form>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // 从 URL 中取 token
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const resetForm = document.getElementById('resetForm');
    const invalidBox = document.getElementById('invalidToken');
    const invalidMsg = document.getElementById('invalidMsg');

    if (!token) {
      resetForm.classList.add('hidden');
      invalidBox.classList.remove('hidden');
      invalidMsg.textContent = '链接无效';
    } else {
      // 校验 token
      fetch('/api/auth/reset-password/' + encodeURIComponent(token))
        .then(r => r.json().then(data => ({ status: r.status, data })))
        .then(({ status, data }) => {
          if (!data.valid) {
            resetForm.classList.add('hidden');
            invalidBox.classList.remove('hidden');
            invalidMsg.textContent = data.error || '链接无效';
          }
        })
        .catch(() => {
          resetForm.classList.add('hidden');
          invalidBox.classList.remove('hidden');
          invalidMsg.textContent = '网络错误';
        });
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPwd = document.getElementById('newPassword').value;
      const confirmPwd = document.getElementById('confirmPassword').value;
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');
      if (newPwd !== confirmPwd) {
        errorMsg.textContent = '两次密码输入不一致';
        errorMsg.classList.remove('hidden');
        return;
      }
      try {
        const result = await api('/api/auth/reset-password', {
          method: 'POST',
          body: { token, new_password: newPwd }
        });
        successMsg.textContent = result.message || '密码重置成功';
        successMsg.classList.remove('hidden');
        setTimeout(() => location.href = window.L('/login'), 1500);
      } catch (err) {
        errorMsg.textContent = err.message || '重置失败';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
