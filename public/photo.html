<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="site.title">作品详情</title>
  <link rel="stylesheet" href="/css/vendor/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- 顶部导航 -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-xl font-bold">
        <span class="text-2xl">📷</span>
        <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent" data-i18n="site.logo">光影集</span>
      </a>
      <nav class="flex items-center gap-6 text-sm">
        <a href="/" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.works">作品</a>
        <a href="/albums" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.albums">摄影集</a>
        <a href="/subscribe" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.subscribe">订阅</a>
        <a href="/admin" id="navAdmin" class="text-gray-600 hover:text-indigo-600 font-medium hidden" data-i18n="nav.admin">后台</a>
        <a href="/login" id="navLogin" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.login">登录</a>
        <a href="/profile" id="navProfile" class="text-gray-600 hover:text-indigo-600 font-medium hidden" data-i18n="nav.profile">个人中心</a>
        <button id="logoutBtn" class="text-gray-500 hover:text-indigo-600 text-sm hidden" data-i18n="nav.logout">登出</button>
        <button id="langSwitch" class="ml-2 px-3 py-1 border border-gray-300 rounded-md text-sm hover:border-indigo-500 hover:text-indigo-600 transition">
          <span id="langLabel">English</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <a id="backLink" href="/" class="inline-flex items-center text-indigo-600 hover:text-indigo-700 mb-6 text-sm">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      <span id="backLinkText" data-i18n="nav.works">作品</span>
    </a>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
      <!-- 大图区 -->
      <div class="lg:col-span-3">
        <div class="relative rounded-2xl overflow-hidden bg-gray-100 shadow-xl">
          <img id="photoImage" src="" alt="" class="w-full h-auto max-h-[80vh] object-contain">
          <div id="premiumOverlay" class="absolute inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center text-white hidden">
            <div class="text-center px-6">
              <div class="text-6xl mb-4">🔒</div>
              <h3 class="text-2xl font-bold mb-3" data-i18n="photo.premiumOnlyTitle">订阅会员专享</h3>
              <p class="text-white/80 mb-6 max-w-md" data-i18n="photo.premiumOnlyDesc">订阅后可查看高清原图及全部付费作品</p>
              <a id="subscribeBtn" href="/subscribe" class="inline-block px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg font-medium hover:opacity-90 transition" data-i18n="photo.subscribeNow">立即订阅</a>
            </div>
          </div>
        </div>
      </div>

      <!-- 信息区 -->
      <div class="lg:col-span-2 space-y-6">
        <div>
          <div class="flex flex-wrap items-center gap-2 mb-3">
            <span id="photoCategory" class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-medium"></span>
            <span id="photoPremium" class="hidden inline-flex items-center px-3 py-1 bg-gradient-to-r from-amber-400 to-orange-400 text-white rounded-full text-xs font-medium" data-i18n="photo.premium">付费</span>
          </div>
          <h1 id="photoTitle" class="text-3xl font-bold text-gray-900 leading-tight mb-3"></h1>
          <div class="flex items-center gap-3 text-sm text-gray-500">
            <span class="flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span id="photoViews">0</span> <span data-i18n="photo.views">次浏览</span>
            </span>
            <span>·</span>
            <span id="photoDate"></span>
          </div>
        </div>

        <p id="photoDescription" class="text-gray-700 leading-relaxed whitespace-pre-line"></p>

        <!-- 评论区 -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <h3 class="text-lg font-bold mb-4"><span data-i18n="photo.comments">评论</span> (<span id="commentCount">0</span>)</h3>

          <div id="commentForm" class="mb-6 hidden">
            <textarea id="commentInput" rows="3" maxlength="500"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              data-i18n-placeholder="photo.commentPlaceholder"></textarea>
            <button id="submitComment" class="mt-2 px-5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg text-sm font-medium hover:opacity-90 transition" data-i18n="photo.submitComment">发表评论</button>
          </div>

          <div id="loginToComment" class="hidden bg-gray-50 text-center py-4 rounded-lg mb-6 text-sm">
            <a id="loginLink" href="/login" class="text-indigo-600 font-medium hover:underline" data-i18n="photo.loginLink">登录</a>
            <span class="text-gray-500" data-i18n="photo.loginToComment">后即可发表评论</span>
          </div>

          <div id="commentList" class="space-y-4"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/photo.js"></script>
</body>
</html>
