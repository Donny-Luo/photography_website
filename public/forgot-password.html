<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.forgotTitle">找回密码 - 光影集</title>
  <link rel="stylesheet" href="/css/vendor/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 1px 1px, white 1px, transparent 0); background-size: 40px 40px;"></div>

  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
    <div class="flex items-center justify-between mb-8">
      <a href="/" class="flex items-center gap-2 text-xl font-bold">
        <span class="text-2xl">📷</span>
        <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent" data-i18n="site.logo">光影集</span>
      </a>
      <button id="langSwitch" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:border-indigo-500 hover:text-indigo-600 transition">
        <span id="langLabel">English</span>
      </button>
    </div>

    <h2 class="text-2xl font-bold text-center mb-2" data-i18n="auth.forgotTitle">找回密码</h2>
    <p class="text-center text-sm text-gray-500 mb-8" data-i18n="auth.forgotDesc">输入注册邮箱，我们将发送重置链接</p>

    <form id="forgotForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="auth.email">邮箱</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          data-i18n-placeholder="auth.emailPlaceholder">
      </div>
      <div id="successMsg" class="hidden px-4 py-3 bg-green-50 text-green-700 rounded-lg text-sm"></div>
      <div id="errorMsg" class="hidden px-4 py-3 bg-red-50 text-red-600 rounded-lg text-sm"></div>
      <div id="devHint" class="hidden px-4 py-3 bg-amber-50 text-amber-800 rounded-lg text-xs break-all"></div>
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-medium hover:opacity-90 transition shadow-lg" data-i18n="auth.sendResetLink">发送重置链接</button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
      <span data-i18n="auth.hasAccount">已有账号？</span>
      <a href="/login" class="text-indigo-600 font-medium hover:underline" data-i18n="auth.loginNow">立即登录</a>
    </p>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // 简易表单提交逻辑（不依赖单独的 js 文件）
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const lang = window.i18n ? window.i18n.getLang() : 'en';
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      const devHint = document.getElementById('devHint');
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');
      devHint.classList.add('hidden');
      try {
        const result = await api('/api/auth/forgot-password', {
          method: 'POST',
          body: { email, lang }
        });
        successMsg.textContent = result.message || '重置链接已发送';
        successMsg.classList.remove('hidden');
        if (result.devLink) {
          devHint.innerHTML = '<strong>🔧 开发模式：</strong><br/>由于未配置 SMTP，重置链接如下：<br/>' +
            '<a href="' + result.devLink + '" class="text-indigo-600 underline">' + result.devLink + '</a>';
          devHint.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = err.message || '请求失败';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
