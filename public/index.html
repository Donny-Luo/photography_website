<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="site.title">光影集</title>
  <link rel="stylesheet" href="/css/vendor/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- 顶部导航 -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-xl font-bold">
        <span class="text-2xl">📷</span>
        <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent" data-i18n="site.logo">光影集</span>
      </a>
      <nav class="flex items-center gap-6 text-sm">
        <a href="/" data-route="/" class="nav-link text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.works">作品</a>
        <a href="/albums" data-route="/albums" class="nav-link text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.albums">摄影集</a>
        <a href="/subscribe" data-route="/subscribe" class="nav-link text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.subscribe">订阅</a>
        <a href="/admin" id="navAdmin" class="nav-link text-gray-600 hover:text-indigo-600 font-medium hidden" data-i18n="nav.admin">后台</a>
        <a href="/login" id="navLogin" class="nav-link text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.login">登录</a>
        <a href="/register" id="navRegister" class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg text-sm font-medium hover:opacity-90 transition" data-i18n="nav.register">注册</a>
        <a href="/profile" id="navProfile" class="nav-link text-gray-600 hover:text-indigo-600 font-medium hidden" data-i18n="nav.profile">个人中心</a>
        <button id="logoutBtn" class="text-gray-500 hover:text-indigo-600 text-sm hidden" data-i18n="nav.logout">登出</button>
        <!-- 语言切换 -->
        <button id="langSwitch" class="ml-2 px-3 py-1 border border-gray-300 rounded-md text-sm hover:border-indigo-500 hover:text-indigo-600 transition">
          <span id="langLabel">English</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="relative overflow-hidden bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 text-white">
    <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 1px 1px, white 1px, transparent 0); background-size: 40px 40px;"></div>
    <div class="relative max-w-7xl mx-auto px-6 py-24 md:py-32 text-center">
      <h1 class="text-4xl md:text-6xl font-bold mb-4 leading-tight" data-i18n="home.heroTitle">用光影，记录瞬间</h1>
      <p class="text-lg md:text-xl text-white/90 max-w-2xl mx-auto" data-i18n="home.heroSubtitle">探索摄影师镜头下的世界，发现美的瞬间</p>
    </div>
  </section>

  <!-- 主内容 -->
  <main class="max-w-7xl mx-auto px-6 py-12">
    <!-- 分类筛选 -->
    <div class="flex flex-wrap gap-3 mb-10" id="categoryFilters">
      <button class="filter-btn active px-5 py-2 bg-indigo-600 text-white rounded-full text-sm font-medium shadow-md" data-category="all" data-i18n="home.filterAll">全部作品</button>
    </div>

    <!-- 照片网格 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="photoGrid">
      <div class="col-span-full text-center py-20 text-gray-400" data-i18n="home.loadingFailed">加载中...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-400 py-10 mt-20">
    <div class="max-w-7xl mx-auto px-6 text-center text-sm">
      <p>© 2026 <span data-i18n="site.logo">光影集</span> Photography. <span data-i18n="footer.copyright">用心记录每一个瞬间.</span></p>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
