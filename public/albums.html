<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="albums.title">摄影集</title>
  <link rel="stylesheet" href="/css/vendor/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-xl font-bold">
        <span class="text-2xl">📷</span>
        <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent" data-i18n="site.logo">光影集</span>
      </a>
      <nav class="flex items-center gap-6 text-sm">
        <a href="/" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.works">作品</a>
        <a href="/albums" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.albums">摄影集</a>
        <a href="/subscribe" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.subscribe">订阅</a>
        <a href="/admin" id="navAdmin" class="text-gray-600 hover:text-indigo-600 font-medium hidden" data-i18n="nav.admin">后台</a>
        <a href="/login" id="navLogin" class="text-gray-600 hover:text-indigo-600 font-medium" data-i18n="nav.login">登录</a>
        <a href="/register" id="navRegister" class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg text-sm font-medium hover:opacity-90 transition" data-i18n="nav.register">注册</a>
        <a href="/profile" id="navProfile" class="text-gray-600 hover:text-indigo-600 font-medium hidden" data-i18n="nav.profile">个人中心</a>
        <button id="logoutBtn" class="text-gray-500 hover:text-indigo-600 text-sm hidden" data-i18n="nav.logout">登出</button>
        <button id="langSwitch" class="ml-2 px-3 py-1 border border-gray-300 rounded-md text-sm hover:border-indigo-500 hover:text-indigo-600 transition">
          <span id="langLabel">English</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-12">
    <!-- Hero 区 -->
    <div class="text-center mb-14">
      <h1 class="text-4xl md:text-5xl font-bold mb-3 bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent" data-i18n="albums.title">全部摄影集</h1>
      <p class="text-gray-500" data-i18n="albums.subtitle">精选主题摄影作品集</p>
    </div>

    <div id="albumsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-10 mt-20">
    <div class="max-w-7xl mx-auto px-6 text-center text-sm">
      <p>© 2026 <span data-i18n="site.logo">光影集</span> Photography. <span data-i18n="footer.copyright">用心记录每一个瞬间.</span></p>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 智能选择封面：自定义封面 > 选定的照片封面 > null
    function getCoverUrl(album) {
      if (album.custom_cover) return '/uploads/' + album.custom_cover;
      if (album.cover_filename) return '/uploads/' + album.cover_filename;
      return null;
    }

    async function loadAlbums() {
      try {
        // 后端返回 { items, pagination }，兼容旧版直接数组
        const data = await api('/api/albums?page=1&pageSize=24');
        const albums = Array.isArray(data) ? data : (data.items || []);
        const grid = document.getElementById('albumsGrid');
        if (albums.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400" data-i18n="albums.noAlbums">暂无摄影集</div>`;
          window.i18n && window.i18n.applyI18n();
          return;
        }
        grid.innerHTML = albums.map(a => {
          const coverUrl = getCoverUrl(a);
          // 用封面作为背景图，叠加渐变蒙版
          const coverStyle = coverUrl
            ? `background-image: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%), url('${coverUrl}'); background-size: cover; background-position: center;`
            : '';
          // Tailwind 2.x 没有 aspect-[4/5]，用 padding-top 技巧做 5:4 比例
          return `
            <a href="${L('/album/' + a.id)}" class="album-card group relative block rounded-2xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-500 hover:-translate-y-2">
              <div class="absolute inset-0 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 transition-transform duration-700 group-hover:scale-110" style="${coverStyle}">
                ${!coverUrl ? `<div class="absolute inset-0 flex items-center justify-center">
                  <span class="text-9xl opacity-30">📚</span>
                </div>` : ''}
              </div>
              <!-- 顶部小标签 -->
              <div class="absolute top-4 left-4 right-4 flex justify-between items-start">
                <span class="px-2.5 py-1 bg-white/20 backdrop-blur-md text-white rounded-full text-xs font-medium">
                  ${a.photo_count} <span data-i18n="albums.photosCount">照片</span>
                </span>
                ${a.custom_cover ? `<span class="px-2.5 py-1 bg-amber-400/90 text-white rounded-full text-xs font-medium" title="自定义封面">📌 Custom</span>` : ''}
              </div>
              <!-- 底部文字 -->
              <div class="absolute bottom-0 left-0 right-0 p-6 text-white">
                <h3 class="text-2xl font-bold mb-2 drop-shadow-lg">${escapeHtml(a.name)}</h3>
                <p class="text-sm text-white/90 line-clamp-2 mb-2 drop-shadow">${escapeHtml(a.description || '')}</p>
                <div class="flex items-center gap-2 text-xs text-white/80">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                  <span>${formatDate(a.created_at)}</span>
                </div>
              </div>
              <!-- hover 时浮出箭头 -->
              <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <div class="w-16 h-16 rounded-full bg-white/30 backdrop-blur-md flex items-center justify-center">
                  <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </div>
              </div>
            </a>
          `;
        }).join('');
        window.i18n && window.i18n.applyI18n();
      } catch (err) {
        showMessage('加载失败', 'error');
      }
    }
    document.addEventListener('DOMContentLoaded', loadAlbums);
  </script>
</body>
</html>
